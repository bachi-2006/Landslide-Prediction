<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Globe Sphere 3D Gradient -->
    <radialGradient id="oceanGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#070f1e" />
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Landmass Gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Atmosphere Highlight -->
    <radialGradient id="atmoGrad" cx="40%" cy="40%" r="50%">
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="98%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </radialGradient>
  </defs>

  <!-- Outer Tech Ring -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 4 2 4" opacity="0.6" />
  
  <!-- Atmosphere Outer Glow -->
  <circle cx="64" cy="64" r="54" fill="#0369a1" opacity="0.25" filter="url(#glow)" />

  <!-- Main Globe Base (Ocean) -->
  <circle cx="64" cy="64" r="52" fill="url(#oceanGrad)" stroke="#1e293b" stroke-width="1" />

  <!-- Continent Vector Paths (Stylized Earth) -->
  <g fill="url(#landGrad)" opacity="0.95">
    <!-- North America -->
    <path d="M 28 32 C 32 26, 42 24, 46 28 C 48 30, 44 38, 38 42 C 34 44, 26 42, 24 38 Z" />
    <!-- South America -->
    <path d="M 38 48 C 42 50, 44 58, 42 66 C 40 74, 34 82, 32 78 C 30 72, 34 60, 38 48 Z" />
    <!-- Europe & Asia -->
    <path d="M 52 24 C 62 20, 82 22, 92 28 C 98 32, 96 44, 88 48 C 78 50, 68 44, 62 46 C 58 48, 54 36, 52 24 Z" />
    <!-- India -->
    <path d="M 72 48 C 76 48, 80 54, 76 60 C 72 64, 70 56, 72 48 Z" />
    <!-- Africa -->
    <path d="M 54 44 C 64 42, 70 52, 66 68 C 62 76, 56 74, 52 64 C 50 56, 50 48, 54 44 Z" />
    <!-- Australia -->
    <path d="M 86 66 C 96 64, 100 72, 94 78 C 88 82, 82 76, 86 66 Z" />
  </g>

  <!-- Latitude & Longitude Grid Lines -->
  <g stroke="#e0f2fe" stroke-width="1" opacity="0.35" fill="none">
    <!-- Equator & Parallel lines -->
    <line x1="12" y1="64" x2="116" y2="64" stroke-width="1.5" />
    <ellipse cx="64" cy="64" rx="52" ry="26" />
    <ellipse cx="64" cy="64" rx="52" ry="42" />
    <!-- Prime Meridian & Longitude curves -->
    <line x1="64" y1="12" x2="64" y2="116" stroke-width="1.5" />
    <ellipse cx="64" cy="64" rx="26" ry="52" />
    <ellipse cx="64" cy="64" rx="42" ry="52" />
  </g>

  <!-- Atmosphere Rim Shading -->
  <circle cx="64" cy="64" r="52" fill="url(#atmoGrad)" pointer-events="none" />

  <!-- Dynamic Location Marker (NE-SHIELD Beacon over region) -->
  <g filter="url(#glow)">
    <circle cx="74" cy="52" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <circle cx="74" cy="52" r="3" fill="#f43f5e" />
    <circle cx="74" cy="52" r="1.5" fill="#ffffff" />
  </g>
</svg>